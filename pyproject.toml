[project]
name = "assistant"
version = "0.1.0"
description = "Faith's personal AI agent: Canvas → Todoist sync, iMessage chat, reminders."
requires-python = ">=3.12"
dependencies = [
  "canvasapi>=3.6",
  "todoist-api-python>=4.0",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "pydantic-ai-slim[anthropic,openai]>=2.48",
  "python-telegram-bot>=22.8",
  "apscheduler>=3.11,<4",
  "google-api-python-client>=2.200",
  "google-auth-oauthlib>=1.4",
  "google-auth-httplib2>=0.4.2",
  "beautifulsoup4>=4.12",
]

[project.scripts]
assistant = "assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
