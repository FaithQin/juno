# Non-secret settings for juno. Secrets live in .env.

agent:
  name: juno
  chat_model: "openai:gpt-6-sol"        # what answers your texts
  background_model: "openai:gpt-6-luna"  # cheap model for later background jobs (unused in phase 2)
  web_search: true                       # let juno search the web (OpenAI native, ~$0.01 per search)

brief:
  time: "07:00"                          # every day, in TIMEZONE
  calendars:                             # Google Calendar names, exactly as they appear in the sidebar
    - Stanford
    - TA
    - faithclairvoyant333@gmail.com
    - StartX
    - Cal.com

nudges:
  scan_minutes: 10                       # how often to look for nudges to send

sync:
  every_minutes: 60                      # Canvas → Todoist

gradescope:
  every_hours: 3                         # Gradescope → Todoist through the saved browser login

calendar:
  target: Stanford                       # Google calendar that receives Canvas events
  every_minutes: 60
  colors:                                # juno colors the events it adds (Faith, 2026-10-03); Google's color names
    class: flamingo                      # classes and sections of graded courses
    audit: grape                         # audited classes
    exam: tomato                         # midterms, finals, exams, quizzes
  # A repeating event juno adds stops at the end of its quarter unless she gives an end (Faith, 2026-10-06).
  # Last day of end-quarter exams, Stanford 2026-27 (studentservices.stanford.edu academic calendar). Add next year's.
  quarter_ends: [2026-12-11, 2027-03-19, 2027-06-09, 2027-08-14]

outlook:
  target: Stanford                       # Google calendar that receives Outlook meetings
  every_minutes: 10                      # how often the published Outlook link is checked
  skip: [ChemE, Chem-E, Chemical Engineering]   # never copied: she left ChemE (2026-10-06); the department still invites her
