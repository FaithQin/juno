    dropped_on: 2026-09-30
  - code: "EE 310"
    dropped_on: 2026-10-02
  - code: "EE 227"           # Robot Perception
    aliases: ["CS 227A"]
    dropped_on: 2026-10-06
    audit: true
  - code: "EE 260A"
    dropped_on: 2026-10-06
    audit: true
  - code: "AA 274A"          # the graduate listing of EE 160A's class
    dropped_on: 2026-10-06
    audit: true
  - code: "ENGR 40M"         # dropped 2026-10-07 for ARMLab (ME 191); she takes it in Spring 2027. Canvas 231533,
    dropped_on: 2026-10-07   # Todoist sub-project 6hcWWXF2wPQ63xGP (archived)
