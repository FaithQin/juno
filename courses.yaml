# Which courses to sync, and where their tasks live in Todoist.
#
# `todoist.project_id` is the parent project, Classes. General class tasks (add/drop,
# withdrawal deadlines) live there with no section. Each course has its own sub-project
# under Classes (`project_id`, decided 2026-09-24; see docs/09-per-course-projects.md).
# A course without `project_id` falls back to the old layout: a section named after the
# course (or `section:`) inside Classes, created on the first sync if missing.
# Keep the ids quoted. Run `uv run assistant courses` to list your Canvas course ids and
# `uv run assistant check` to confirm every sub-project exists under Classes.

todoist:
  project_id: "6cXPJPmRH6GF2MPr"   # "Classes", under Areas
  project_name: "Classes"

courses:
  # Graded classes (Faith, 2026-10-07): synced from Canvas (canvas_id) and Gradescope (matched by code), nudged.
  # Her study list is 18 units: these four (15) plus ME 191 (ARMLab, 3 units S/NC), which is deliberately not
  # listed here: its tasks live in Research > ARMLab, outside Classes (her call, 2026-10-07).
  # No audits any more ("im done auditing lectures", 2026-10-06); `audit: true` still works if that changes.
  - code: "CME 102"
    canvas_id: 232579
    project_id: "6hcWWXF7PMmh57v2"
  - code: "EE 100"
    canvas_id: 232825
    project_id: "6hcWWXGX4RFgHc5C"
  - code: "CS 106B"
    canvas_id: null          # its Canvas site (232548) is empty; assignments come from Paperless, the site and Gradescope
    website: "https://web.stanford.edu/class/cs106b/"
    project_id: "6hcWWXHRpx3H2RvF"
  - code: "EE 160A"          # Principles of Robot Autonomy I, 4 units. Sites checked read-only on 2026-10-06:
    canvas_id: 231155        # one Canvas site for AA 174A / CS 137A / EE 160A; her enrollment is the EE 160A section
    aliases: ["AA 174A", "CS 137A"]   # Canvas calls it "F26-AA-174A-01...", Ed "AA 174A 01" (course 106110); Gradescope 1396967 matches by code
    canvas_events: false     # its Canvas calendar (55 events: lectures, CA office hours, both section groups) stays off Google until she says
    project_id: "6hg9Mmh6R7Q68H7M"

# Dropped classes and ended audits: juno says so if they come up, and the class check stays quiet about
# their leftovers (EE 227 and EE 260A's Todoist projects are archived; their open tasks are invisible to juno).
dropped:
